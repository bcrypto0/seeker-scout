name = "seeker-lounge"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Founding-number claims for the Owners' Lounge (docs/BATTLE_PLAN_V02.md,
# "CEO decision" section). One claim per Genesis Token mint, forever.
[[d1_databases]]
binding = "DB"
database_name = "seeker-lounge"
database_id = "7a8a7f11-17cd-40f1-afba-9af1b14af5c8"

# Hourly SKR re-weight of stored vouch and vote weights (src/skr.js reweightVouches,
# SPEC-skr-final 1.10); the 03:07 UTC tick also runs the drift check. One Cron Trigger
# (Workers Free allows 5 per account). Paused, with no chain call, by
#   UPDATE settings SET value='0' WHERE key='skr_read_enabled'
# Wallets per tick default to 99 (one getMultipleAccounts call, sized for the Free plan's
# 10 ms cron CPU). On the Paid plan only, add REWEIGHT_MAX_WALLETS = "2000" under [vars].
[triggers]
crons = ["7 * * * *"]

# RPC endpoint: set via `wrangler secret put RPC_URL` (Triton recommended).
# Deliberately NOT in [vars] — a var here would clobber the secret on every
# deploy. The worker falls back to the public mainnet RPC when unset.

# Scout Alpha (docs/SCOUT_ALPHA_SPEC.md §2). Secrets — same reasoning as
# RPC_URL, keep them OUT of [vars]:
#   wrangler secret put ALPHA_INGEST_SECRET   # exporter's x-alpha-key
#   wrangler secret put CHAT_SECRET           # already set; also signs alpha tokens
[vars]
# Dedicated USDC-receiving treasury for Alpha revenue (created 2026-07-30).
# Receive-only: its key is cold and nothing here ever signs with it. Must stay
# identical to ALPHA_TREASURY in src/lib/alpha.ts — the app refuses to pay when
# the two disagree. If this is ever a non-base58-32-byte string the worker
# reports sales_open=false and refuses /alpha/subscribe.
ALPHA_TREASURY = "CosHYybYt2VP6ScfJYqP2KoMFpKL8uckm3fT1JcM71h9"
ALPHA_PRICE_USDC = "9.99"
